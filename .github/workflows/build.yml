name: Linux Build
on: [push,pull_request]
jobs:
  build:
    name: Build on Linux
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - compiler: gcc
            cxx: g++
          - compiler: clang
            cxx: clang++
    steps:
      uses: actions/checkout@v4

    - name: Установка зависимостей
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake gcc g++ clang
    - name: Конфигурация
      run: |
        mkdir build
        cd build
        cmake ..
    - name: Сборка
      run: |
        cmake --build .



